<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live HTML Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1420;
    --panel:rgba(20,26,40,0.55);
    --panel-solid:#141a28;
    --border:rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.16);
    --accent:#7c9dff;
    --accent-2:#8f6fff;
    --text:#e6e9f2;
    --text-dim:#8891a8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,157,255,0.12), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(143,111,255,0.10), transparent 45%),
      var(--bg-0);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    overflow:hidden;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* Topbar */
  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px;
    background:var(--panel);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-bottom:1px solid var(--border);
    z-index:10;
  }
  .logo{
    width:34px;height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    font-size:15px;
    color:#0a0e17;
    box-shadow:0 4px 18px rgba(124,157,255,0.35);
    flex-shrink:0;
  }
  .title-block{display:flex;flex-direction:column;margin-right:auto;}
  .title-block h1{
    font-size:15px;margin:0;font-weight:600;letter-spacing:0.2px;
  }
  .title-block span{
    font-size:11px;color:var(--text-dim);
  }
  .btn{
    display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    transition:all .18s ease;
    white-space:nowrap;
  }
  .btn:hover{
    background:rgba(255,255,255,0.09);
    border-color:var(--border-hover);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0);}
  .btn.primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:none;color:#0a0e17;font-weight:600;
  }
  .btn.primary:hover{
    box-shadow:0 4px 16px rgba(124,157,255,0.35);
  }
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  #fileInput{display:none;}

  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:#5ee6a0;
    box-shadow:0 0 8px #5ee6a0;
    margin-right:4px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
  }

  /* Workspace */
  .workspace{
    flex:1;
    display:flex;
    min-height:0;
  }
  .pane{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    position:relative;
  }
  .pane-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 16px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dim);
    background:rgba(255,255,255,0.02);
    border-bottom:1px solid var(--border);
  }
  .pane-header .dot-row{display:flex;gap:6px;}
  .pane-header .dot-row span{
    width:9px;height:9px;border-radius:50%;
    display:inline-block;
  }
  .d-red{background:#ff5f57;}
  .d-yellow{background:#febc2e;}
  .d-green{background:#28c840;}

  #editor-container{
    flex:1;
    min-height:0;
  }

  .divider{
    width:1px;
    background:var(--border);
    position:relative;
  }

  .preview-pane{
    background:#0d111b;
  }
  .preview-frame-wrap{
    flex:1;
    min-height:0;
    position:relative;
    background:#ffffff;
  }
  iframe#preview{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#fff;
  }

  /* Responsive */
  @media (max-width: 860px){
    .workspace{flex-direction:column;}
    .divider{width:100%;height:1px;}
    .pane{flex:none;}
    #editor-container{height:45vh;}
    .preview-frame-wrap{height:45vh;}
    .title-block span{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="logo">&lt;/&gt;</div>
    <div class="title-block">
      <h1>Live HTML Studio</h1>
      <span>Real-time editor &amp; preview</span>
    </div>

    <input type="file" id="fileInput" accept=".html,.htm,text/html">
    <button class="btn" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M6 9l6-6 6 6M4 21h16"/></svg>
      Upload HTML
    </button>
    <button class="btn primary" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M6 9l6 6 6-6M4 21h16"/></svg>
      Download HTML
    </button>
  </div>

  <div class="workspace">
    <div class="pane editor-pane">
      <div class="pane-header">
        <div class="dot-row"><span class="d-red"></span><span class="d-yellow"></span><span class="d-green"></span></div>
        <span><span class="status-dot"></span>index.html</span>
      </div>
      <div id="editor-container"></div>
    </div>

    <div class="divider"></div>

    <div class="pane preview-pane">
      <div class="pane-header">
        <span>Preview</span>
        <span id="syncBadge">sync: body</span>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="preview" title="live preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/loader.min.js"></script>
<script>
(function(){
  "use strict";

  var DEFAULT_HTML =
'<!DOCTYPE html>\n' +
'<html lang="en">\n' +
'<head>\n' +
'<meta charset="UTF-8">\n' +
'<title>My Page</title>\n' +
'<style>\n' +
'  body{\n' +
'    margin:0;\n' +
'    font-family: system-ui, sans-serif;\n' +
'    background:#f6f7fb;\n' +
'    color:#1a1d29;\n' +
'  }\n' +
'  .hero{\n' +
'    padding:80px 40px;\n' +
'    text-align:center;\n' +
'    background:linear-gradient(135deg,#6a8dff,#a06bff);\n' +
'    color:#fff;\n' +
'  }\n' +
'  .hero h1{ font-size:42px; margin:0 0 12px; }\n' +
'  .section{\n' +
'    max-width:720px;\n' +
'    margin:0 auto;\n' +
'    padding:60px 24px;\n' +
'  }\n' +
'  .card{\n' +
'    background:#fff;\n' +
'    border-radius:12px;\n' +
'    padding:24px;\n' +
'    margin-bottom:20px;\n' +
'    box-shadow:0 4px 18px rgba(0,0,0,0.06);\n' +
'  }\n' +
'</style>\n' +
'<script>\n' +
'  // Some JS up here, in the head, should not affect scroll sync either.\n' +
'  function noop(){ return 1 + 1; }\n' +
'  console.log("Loaded", noop());\n' +
'<\/script>\n' +
'</head>\n' +
'<body>\n' +
'\n' +
'  <div class="hero">\n' +
'    <h1>Welcome to Live HTML Studio</h1>\n' +
'    <p>Edit the code on the left — this preview updates as you type.</p>\n' +
'  </div>\n' +
'\n' +
'  <div class="section">\n' +
'    <div class="card">\n' +
'      <h2>Scroll me!</h2>\n' +
'      <p>Try scrolling through this body content in the editor — the preview will follow along proportionally.</p>\n' +
'    </div>\n' +
'    <div class="card">\n' +
'      <h2>But not the CSS/JS above</h2>\n' +
'      <p>Scroll up into the &lt;style&gt; or &lt;script&gt; blocks at the top of the file and the preview will stay perfectly still.</p>\n' +
'    </div>\n' +
'    <div class="card">\n' +
'      <h2>Card three</h2>\n' +
'      <p>Padding content so this file has some real length to scroll through.</p>\n' +
'    </div>\n' +
'    <div class="card">\n' +
'      <h2>Card four</h2>\n' +
'      <p>Keep scrolling to see the sync in action, all the way to the bottom.</p>\n' +
'    </div>\n' +
'    <div class="card">\n' +
'      <h2>Card five</h2>\n' +
'      <p>This is near the bottom of the body content.</p>\n' +
'    </div>\n' +
'  </div>\n' +
'\n' +
'</body>\n' +
'</html>\n';

  var editor = null;
  var previewEl = document.getElementById('preview');
  var debounceTimer = null;
  var DEBOUNCE_MS = 250;

  var isApplyingScrollSync = false;

  // ---------- Monaco bootstrap ----------
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      value: DEFAULT_HTML,
      language: 'html',
      theme: 'vs-dark',
      automaticLayout: true,
      minimap: { enabled: true },
      fontSize: 13.5,
      lineHeight: 21,
      wordWrap: 'off',
      scrollBeyondLastLine: false,
      smoothScrolling: true,
      renderLineHighlight: 'all',
      padding: { top: 12 }
    });

    updatePreview(true);

    editor.onDidChangeModelContent(function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function(){
        updatePreview(false);
      }, DEBOUNCE_MS);
    });

    editor.onDidScrollChange(function () {
      if (isApplyingScrollSync) return;
      syncPreviewScrollFromEditor();
    });
  });

  // ---------- Find where <body> content starts, by line number ----------
  function getBodyStartLine(model) {
    var totalLines = model.getLineCount();
    var bodyTagMatch = model.findNextMatch(
      '<body[^>]*>',
      { lineNumber: 1, column: 1 },
      true, false, null, false
    );

    if (!bodyTagMatch) {
      return 1;
    }

    var endLine = bodyTagMatch.range.endLineNumber;
    var endColumn = bodyTagMatch.range.endColumn;
    var lineLength = model.getLineMaxColumn(endLine);

    if (endColumn < lineLength) {
      return endLine;
    }
    var nextLine = endLine + 1;
    return Math.min(nextLine, totalLines);
  }

  // ---------- Compute 0..1 percentage, anchored on TOP edges, not centers ----------
  // This is the fix: we now compare "how far has the TOP of my editor viewport
  // moved into the content region" against "how far should the TOP of the
  // preview's visible area move down the rendered page" — same reference
  // point on both sides, so what you see at the top of the editor pane lines
  // up with what you see at the top of the preview pane.
  function computeContentScrollPercentage() {
    if (!editor) return null;
    var model = editor.getModel();
    if (!model) return null;

    var totalLines = model.getLineCount();
    var bodyStartLine = getBodyStartLine(model);
    var lastLine = totalLines;

    var contentTop = editor.getTopForLineNumber(bodyStartLine);
    var contentBottom = editor.getBottomForLineNumber(lastLine);
    var contentHeight = Math.max(1, contentBottom - contentTop);

    var scrollTop = editor.getScrollTop();
    var viewportHeight = editor.getLayoutInfo().height;

    // Use the TOP of the viewport as the reference point (was: center).
    var raw = (scrollTop - contentTop) / contentHeight;

    if (raw < 0) raw = 0;
    if (raw > 1) raw = 1;

    return {
      percent: raw,
      isAboveContent: (scrollTop + viewportHeight) < contentTop,
      contentHeight: contentHeight,
      editorViewportHeight: viewportHeight
    };
  }

  function syncPreviewScrollFromEditor() {
    if (!previewEl || !previewEl.contentWindow || !previewEl.contentDocument) return;

    var info = computeContentScrollPercentage();
    if (!info) return;

    var doc = previewEl.contentDocument;
    var scrollEl = doc.scrollingElement || doc.documentElement || doc.body;
    if (!scrollEl) return;

    if (info.isAboveContent) {
      updateSyncBadge('above body — preview still');
      return;
    }

    // Max scroll for the TOP of the preview viewport to reach (so its own
    // viewport-height's-worth of content still fits below it), matching how
    // we measured the editor's top edge above.
    var maxScroll = Math.max(0, scrollEl.scrollHeight - previewEl.clientHeight);
    var target = Math.round(maxScroll * info.percent);

    isApplyingScrollSync = true;
    try {
      scrollEl.scrollTop = target;
    } catch (e) {}
    isApplyingScrollSync = false;

    updateSyncBadge('body · ' + Math.round(info.percent * 100) + '%');
  }

  function updateSyncBadge(text) {
    var badge = document.getElementById('syncBadge');
    if (badge) badge.textContent = 'sync: ' + text;
  }

  // ---------- Preview update, preserving scroll position across reload ----------
  function updatePreview(isInitial) {
    if (!editor) return;
    var html = editor.getValue();

    var prevScrollX = 0;
    var prevScrollY = 0;

    if (!isInitial && previewEl.contentWindow) {
      try {
        prevScrollX = previewEl.contentWindow.scrollX || 0;
        prevScrollY = previewEl.contentWindow.scrollY || 0;
      } catch (e) {
        prevScrollX = 0;
        prevScrollY = 0;
      }
    }

    previewEl.onload = function () {
      try {
        if (!isInitial) {
          previewEl.contentWindow.scrollTo(prevScrollX, prevScrollY);
        }
      } catch (e) {}
    };

    previewEl.srcdoc = html;
  }

  // ---------- Upload ----------
  var uploadBtn = document.getElementById('uploadBtn');
  var fileInput = document.getElementById('fileInput');

  uploadBtn.addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (evt) {
      var text = evt.target.result;
      if (editor) {
        editor.setValue(text);
        editor.setScrollPosition({ scrollTop: 0 });
        updatePreview(true);
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  // ---------- Download ----------
  var downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.addEventListener('click', function () {
    if (!editor) return;
    var content = editor.getValue();
    var blob = new Blob([content], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

})();
</script>
</body>
</html>
